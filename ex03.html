<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparar eventos com Listener</title>
    <style>
        body{
            background: rgb(123, 163, 212);
        }
         div#area{
            background: red;
            color: white;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Disparar eventos com Listener</h1>
    <p>Além de disparar eventos dentro do HTML, podemos disparar utilizando listener dentro do JS.</p>
    <div id="area">Interaja</div>
    <a href="../ex00.html" rel="prev">Volte para a homepage!</a>
    <script>
        var a = document.querySelector('div#area')
        a.addEventListener('click',clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)
        function clicar(){
            a.innerHTML='Clicou'
            a.style.background='purple'
        }
        function entrar(){
            a.innerHTML='Entrou'
            a.style.background='blue'
        }
        function sair(){
            a.innerHTML='Saiu'
            a.style.background='red'
        }
    </script>
</body>
</html>
